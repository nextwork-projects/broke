<!doctype html>
<html><head><meta charset="utf-8"><title>broke 2000s</title>
<style>
  body{margin:0;background:#efeeea;font-family:Tahoma,Verdana,sans-serif;padding:32px}
  h2{font:600 13px Menlo,monospace;color:#777;margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;flex-wrap:wrap;gap:16px}
  .t{width:260px;height:260px;border-radius:22px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .t .n{position:absolute;top:12px;left:14px;font:11px Menlo,monospace;opacity:.55;z-index:2}
  .t svg{width:236px;height:236px}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
  <linearGradient id="aquaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be15d"/><stop offset="1" stop-color="#2f9e2f"/></linearGradient>
  <linearGradient id="aquaB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc4ff"/><stop offset="1" stop-color="#1767d6"/></linearGradient>
  <linearGradient id="xpTitle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d8bf8"/><stop offset=".15" stop-color="#0a5fe0"/><stop offset="1" stop-color="#0745b8"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2d55"/><stop offset=".25" stop-color="#ff9500"/><stop offset=".5" stop-color="#ffd60a"/><stop offset=".75" stop-color="#34c759"/><stop offset="1" stop-color="#0a84ff"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="reflect"><rect x="0" y="0" width="240" height="240" fill="url(#fade)"/></mask>
  <path id="burst" d="M0,-30 L7,-20 L19,-24 L18,-12 L29,-6 L21,3 L27,14 L15,16 L12,28 L2,21 L-8,28 L-11,16 L-23,14 L-17,3 L-25,-6 L-14,-12 L-15,-24 L-3,-20Z"/>
</defs></svg>

<h2>F · broke, circa 2006</h2>
<div class="row">

  <!-- F1 web 2.0: drop the vowel, add beta -->
  <div class="t" style="background:#fff"><span class="n">F1 brokr beta</span>
    <svg viewBox="0 0 240 240">
      <text x="104" y="124" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica" font-weight="700" font-size="64" letter-spacing="-3"><tspan fill="#ff0084">bro</tspan><tspan fill="#0063dc">kr</tspan></text>
      
      <g transform="translate(200 62) rotate(14)"><use href="#burst" fill="#ff7b00" transform="scale(1.05)"/><text y="5" text-anchor="middle" font-family="Verdana" font-weight="700" font-size="13" fill="#fff">beta</text></g>
      <text x="120" y="190" text-anchor="middle" font-family="Verdana" font-size="11" fill="#999">your money. gone. 2.0</text>
    </svg></div>

  <!-- F2 XP error dialog -->
  <div class="t" style="background:#3a6ea5"><span class="n" style="color:#fff">F2 broke.exe</span>
    <svg viewBox="0 0 240 240">
      <rect x="20" y="58" width="200" height="124" rx="8" fill="#ece9d8" stroke="#0745b8" stroke-width="3"/>
      <path d="M20,66 a8,8 0 0 1 8,-8 H212 a8,8 0 0 1 8,8 V84 H20Z" fill="url(#xpTitle)"/>
      <text x="30" y="77" font-family="Trebuchet MS" font-weight="700" font-size="12" fill="#fff">broke.exe</text>
      <rect x="196" y="62" width="18" height="18" rx="3" fill="#e2492f" stroke="#fff" stroke-width="1.2"/><path d="M200,66 l10,10 m0,-10 l-10,10" stroke="#fff" stroke-width="2.2"/>
      <circle cx="48" cy="114" r="15" fill="#e2492f" stroke="#a51d0c" stroke-width="1.5"/><path d="M42,108 l12,12 m0,-12 l-12,12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="72" y="110" font-family="Tahoma" font-size="12" fill="#000">Insufficient funds.</text>
      <text x="72" y="126" font-family="Tahoma" font-size="11" fill="#555">Balance: $0.00</text>
      <rect x="85" y="146" width="70" height="24" rx="3" fill="#f5f4ee" stroke="#003c74" stroke-width="1.2"/>
      <text x="120" y="162" text-anchor="middle" font-family="Tahoma" font-size="12">OK :(</text>
    </svg></div>

  <!-- F3 aqua gel coin -->
  <div class="t" style="background:linear-gradient(#f4f8fc,#cfd9e4)"><span class="n">F3 aqua coin</span>
    <svg viewBox="0 0 240 240">
      <ellipse cx="120" cy="196" rx="54" ry="8" fill="#000" opacity=".15"/>
      <circle cx="120" cy="110" r="66" fill="url(#gold)" stroke="#b07208" stroke-width="3"/>
      <text x="120" y="138" text-anchor="middle" font-family="Georgia" font-weight="700" font-size="78" fill="#b07208" opacity=".55">$</text>
      <path d="M128,48 L108,92 L138,114 L118,172" fill="none" stroke="#5a3a00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="120" cy="76" rx="52" ry="30" fill="url(#gloss)"/>
      <text x="120" y="226" text-anchor="middle" font-family="Lucida Grande, Helvetica" font-weight="700" font-size="22" fill="#333">broke</text>
    </svg></div>

  <!-- F4 WordArt -->
  <div class="t" style="background:#fff"><span class="n">F4 wordart</span>
    <svg viewBox="0 0 240 240">
      <g transform="translate(120 124) skewY(-8)">
        <text text-anchor="middle" font-family="Impact, Arial Black" font-size="76" fill="#888" transform="translate(5 5)">broke</text>
        <text text-anchor="middle" font-family="Impact, Arial Black" font-size="76" fill="url(#rainbow)" stroke="#222" stroke-width="2">broke</text>
      </g>
      <text x="120" y="190" text-anchor="middle" font-family="Comic Sans MS" font-size="14" fill="#c00">~*~ ballin on a budget ~*~</text>
    </svg></div>
</div>

<div class="row" style="margin-top:16px">
  <!-- F5 loading bar -->
  <div class="t" style="background:#008080"><span class="n" style="color:#fff">F5 loading balance</span>
    <svg viewBox="0 0 240 240">
      <rect x="22" y="76" width="196" height="96" fill="#c0c0c0" stroke="#fff" stroke-width="2"/><rect x="22" y="76" width="196" height="96" fill="none" stroke="#404040" stroke-width="2" transform="translate(2 2)"/>
      <rect x="24" y="78" width="192" height="18" fill="#000080"/><text x="30" y="91" font-family="Tahoma" font-weight="700" font-size="11" fill="#fff">broke</text>
      <text x="34" y="118" font-family="Tahoma" font-size="12">Loading your money...</text>
      <rect x="34" y="128" width="172" height="20" fill="#fff" stroke="#808080" stroke-width="2"/>
      <rect x="37" y="131" width="6" height="14" fill="#000080"/>
      <text x="34" y="164" font-family="Tahoma" font-size="10" fill="#333">Time remaining: forever</text>
    </svg></div>

  <!-- F6 glossy pill + starburst -->
  <div class="t" style="background:linear-gradient(#e9f3ff,#fff)"><span class="n">F6 glossy pill</span>
    <svg viewBox="0 0 240 240">
      <rect x="28" y="88" width="184" height="64" rx="32" fill="url(#aquaG)" stroke="#237a23" stroke-width="2"/>
      <rect x="40" y="92" width="160" height="26" rx="13" fill="url(#gloss)"/>
      <text x="120" y="132" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica" font-weight="700" font-size="36" fill="#fff" stroke="#1d5e1d" stroke-width=".8">broke</text>
      <g transform="translate(184 72) rotate(-12)"><use href="#burst" fill="#ffe500" stroke="#e08a00" stroke-width="1.5" transform="scale(1.4)"/>
        <text y="-2" text-anchor="middle" font-family="Verdana" font-weight="700" font-size="9" fill="#d00">NOW 0%</text><text y="9" text-anchor="middle" font-family="Verdana" font-weight="700" font-size="9" fill="#d00">MONEY!</text></g>
      <text x="120" y="182" text-anchor="middle" font-family="Verdana" font-size="11" fill="#5a8">™ ® © (can't afford the lawyer)</text>
    </svg></div>

  <!-- F7 under construction -->
  <div class="t" style="background:#000"><span class="n" style="color:#fff">F7 under construction</span>
    <svg viewBox="0 0 240 240">
      <defs><pattern id="hz" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#ffd400"/><rect x="10" width="10" height="20" fill="#000"/></pattern></defs>
      <rect x="16" y="60" width="208" height="22" fill="url(#hz)"/><rect x="16" y="158" width="208" height="22" fill="url(#hz)"/>
      <text x="120" y="133" text-anchor="middle" font-family="Courier New" font-weight="700" font-size="50" fill="#0f0">broke</text>
      <text x="120" y="204" text-anchor="middle" font-family="Times New Roman" font-size="12" fill="#ff0">wallet under construction</text>
      <text x="120" y="48" text-anchor="middle" font-family="Times New Roman" font-size="11" fill="#0ff">visitors: 000000</text>
    </svg></div>

  <!-- F8 aqua wallet with moth -->
  <div class="t" style="background:linear-gradient(#f4f8fc,#cfd9e4)"><span class="n">F8 gel wallet</span>
    <svg viewBox="0 0 240 240">
      <ellipse cx="120" cy="184" rx="70" ry="8" fill="#000" opacity=".15"/>
      <rect x="44" y="92" width="152" height="88" rx="16" fill="url(#aquaB)" stroke="#0e4ea8" stroke-width="3"/>
      <rect x="150" y="116" width="58" height="38" rx="12" fill="#0e4ea8"/><circle cx="168" cy="135" r="6" fill="url(#gold)"/>
      <rect x="54" y="96" width="132" height="34" rx="12" fill="url(#gloss)"/>
      <g transform="translate(116 52) rotate(-10)" fill="#9b8b74"><path d="M0,-2 L-24,-16 Q-30,-2 -18,4Z"/><path d="M0,-2 L24,-16 Q30,-2 18,4Z"/><path d="M0,2 L-16,6 Q-16,16 -4,10Z" fill="#7d6e5a"/><path d="M0,2 L16,6 Q16,16 4,10Z" fill="#7d6e5a"/><ellipse rx="3" ry="9" fill="#5e5242"/><path d="M-1,-8 q-4,-6 -9,-8 M1,-8 q4,-6 9,-8" stroke="#5e5242" stroke-width="1.2" fill="none"/></g>
      <path d="M96,82 q4,-8 10,-14 M128,82 q-2,-8 -8,-14" stroke="#8a7a66" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
      <text x="120" y="222" text-anchor="middle" font-family="Lucida Grande, Helvetica" font-weight="700" font-size="22" fill="#333">broke</text>
    </svg></div>
</div>
</body></html>
