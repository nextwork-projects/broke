<!doctype html>
<html><head><meta charset="utf-8"><title>broke logo v3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#efeeea;font-family:Inter,system-ui,sans-serif;padding:32px}
  h2{font:600 13px 'JetBrains Mono',monospace;color:#777;margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;flex-wrap:wrap;gap:16px}
  .t{width:220px;height:220px;border-radius:22px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .t .n{position:absolute;top:14px;left:16px;font:11px 'JetBrains Mono',monospace;opacity:.55}
  .t .w{font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1;display:flex;align-items:center}
  .t svg{width:120px;height:96px}
  .t .w svg{width:30px;height:30px;margin:0 1px}
  .dark{background:#141414;color:#fff}.light{background:#fff;color:#3d8a55}
  .blue{background:#5b6cf0;color:#fff}.lightb{background:#fff;color:#1a1a1a}
  .s{fill:none;stroke:currentColor;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
</style></head><body>

<h2>D · other things that say broke</h2>
<div class="row">
  <div class="t light"><span class="n">D1 pocket</span>
    <svg viewBox="0 0 100 80"><path d="M38,30 V58 Q38,74 50,74 Q62,74 62,58 V30Z" fill="#bfe0c8"/>
      <path class="s" d="M16,8 H84 V30 Q50,44 16,30Z"/><path class="s" d="M38,34 V58 Q38,74 50,74 Q62,74 62,58 V34"/></svg>
    <span class="w">broke</span></div>

  <div class="t dark"><span class="n">D2 piggy</span>
    <svg viewBox="0 0 100 80"><ellipse cx="48" cy="42" rx="30" ry="22" fill="#5b6cf0"/>
      <path d="M30,24 L28,10 L42,20Z" fill="#5b6cf0"/><rect x="74" y="34" width="12" height="14" rx="5" fill="#8b98ff"/>
      <rect x="28" y="58" width="8" height="12" rx="3" fill="#5b6cf0"/><rect x="58" y="58" width="8" height="12" rx="3" fill="#5b6cf0"/>
      <rect x="40" y="24" width="16" height="4" rx="2" fill="#141414"/>
      <path d="M50,30 L44,40 L52,46 L46,58" fill="none" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span class="w">broke</span></div>

  <div class="t lightb"><span class="n">D3 receipt</span>
    <svg viewBox="0 0 100 80"><path d="M30,4 H70 V70 L65,65 L60,70 L55,65 L50,70 L45,65 L40,70 L35,65 L30,70Z" fill="#5b6cf0"/>
      <g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M38,16 H62"/><path d="M38,26 H56"/><path d="M38,36 H60"/></g>
      <text x="50" y="57" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="#fff">$0</text></svg>
    <span class="w">broke</span></div>

  <div class="t light"><span class="n">D4 torn bill</span>
    <svg viewBox="0 0 100 80"><clipPath id="tl"><path d="M0,0 H50 L46,14 L53,26 L45,40 L52,54 L47,80 H0Z"/></clipPath><clipPath id="tr"><path d="M50,0 H100 V80 H47 L52,54 L45,40 L53,26 L46,14Z"/></clipPath>
      <g id="bill"><rect x="12" y="20" width="76" height="42" rx="6" fill="#3d8a55"/><circle cx="50" cy="41" r="10" fill="none" stroke="#bfe0c8" stroke-width="3.5"/>
      <circle cx="22" cy="30" r="2.5" fill="#bfe0c8"/><circle cx="78" cy="52" r="2.5" fill="#bfe0c8"/></g>
      <use href="#bill" clip-path="url(#tl)" transform="translate(-7 3) rotate(-9 30 41)"/>
      <use href="#bill" clip-path="url(#tr)" transform="translate(7 -3) rotate(9 70 41)"/>
      <path d="M50,10 L46,24 L53,34 L45,46 L52,58 L47,72" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>
    <span class="w">broke</span></div>

  <div class="t blue"><span class="n">D5 money flying</span>
    <svg viewBox="0 0 100 80"><path d="M34,38 Q14,30 8,14 Q22,22 34,24 Q20,18 18,8 Q30,16 38,28Z" fill="#fff" opacity=".75"/>
      <path d="M66,38 Q86,30 92,14 Q78,22 66,24 Q80,18 82,8 Q70,16 62,28Z" fill="#fff" opacity=".75"/>
      <circle cx="50" cy="42" r="20" fill="#f5c451"/><text x="50" y="51" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="#5b6cf0">$</text></svg>
    <span class="w">broke</span></div>

  <div class="t dark"><span class="n">D6 band-aid</span>
    <svg viewBox="0 0 100 80"><rect x="15" y="20" width="70" height="44" rx="6" fill="#5b6cf0"/><rect x="22" y="29" width="10" height="8" rx="1.5" fill="#f5c451"/>
      <g transform="rotate(-30 50 42)"><rect x="22" y="33" width="56" height="18" rx="9" fill="#f2d4b8"/><rect x="40" y="33" width="20" height="18" fill="#e6bf9c"/>
      <g fill="#c99b74"><circle cx="45" cy="38" r="1.3"/><circle cx="50" cy="38" r="1.3"/><circle cx="55" cy="38" r="1.3"/><circle cx="45" cy="46" r="1.3"/><circle cx="50" cy="46" r="1.3"/><circle cx="55" cy="46" r="1.3"/></g></g></svg>
    <span class="w">broke</span></div>
</div>

<h2>E · more</h2>
<div class="row">
  <div class="t light"><span class="n">E1 empty bar</span>
    <svg viewBox="0 0 100 80"><rect class="s" x="14" y="26" width="64" height="30" rx="8"/><rect x="82" y="35" width="6" height="12" rx="2" fill="currentColor"/>
      <rect x="21" y="33" width="8" height="16" rx="3" fill="#e0533d"/></svg>
    <span class="w">broke</span></div>

  <div class="t dark"><span class="n">E2 crash</span>
    <svg viewBox="0 0 100 80"><path d="M10,16 L30,28 L42,22 L60,52 L72,46 L90,68" fill="none" stroke="#8b98ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="90" cy="68" r="6" fill="#f5c451"/></svg>
    <span class="w">broke</span></div>

  <div class="t lightb"><span class="n">E3 $0</span>
    <svg viewBox="0 0 100 80"><rect x="14" y="14" width="72" height="52" rx="26" fill="#5b6cf0"/>
      <text x="50" y="52" text-anchor="middle" font-family="Inter" font-weight="800" font-size="34" fill="#fff" letter-spacing="-1">$0</text></svg>
    <span class="w">broke</span></div>

  <div class="t blue"><span class="n">E4 cracked coin</span>
    <svg viewBox="0 0 100 80"><circle cx="50" cy="40" r="30" fill="#f5c451"/><circle cx="50" cy="40" r="22" fill="none" stroke="#e0a92e" stroke-width="3"/>
      <path d="M53,10 L44,32 L58,42 L48,70" fill="none" stroke="#5b6cf0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span class="w">broke</span></div>

  <div class="t dark"><span class="n">E5 wordmark coin</span>
    <span class="w" style="font-size:44px">br<svg viewBox="0 0 30 30" style="width:38px;height:38px"><circle cx="15" cy="16" r="12" fill="#f5c451"/>
      <path d="M16,4 L12,13 L18,17 L14,28" fill="none" stroke="#141414" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>ke</span></div>

  <div class="t light"><span class="n">E6 wordmark wallet</span>
    <span class="w" style="font-size:44px">br<svg viewBox="0 0 30 30" style="width:40px;height:40px"><g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3" y="9" width="24" height="17" rx="4"/><path d="M27,14 H21 a3,3 0 0 0 0,6 H27"/></g></svg>ke</span></div>
</div>
</body></html>
